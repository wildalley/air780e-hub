name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [agent, server]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.project }}/uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen ruff check .

  agent:
    name: Agent tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared by requires-python; 3.14 is what a current
        # Arch/Fedora host provides as `python3`, and the Agent is installed
        # against the system interpreter (see docs/deploy.md §2.1), so the
        # matrix ceiling has to track the newest stable release — not the
        # version the Docker image happens to pin.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - name: Select Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --frozen pytest

  server:
    name: Server tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Select Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --frozen pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Keep in step with server/Dockerfile's frontend stage.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Typecheck and build
        run: npm run build

  image:
    name: Server image build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Lowercase the image name
        id: image
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          tags: ${{ steps.image.outputs.value }}:sha-${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          progress: plain
          provenance: false
          sbom: false
          # Keep npm/uv output visible in CI so a registry stall is diagnosable
          # instead of looking like a silent RUN step.
      - name: Report published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          {
            echo "### Server image"
            echo
            echo '```'
            echo "${{ steps.image.outputs.value }}:sha-${GITHUB_SHA}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate Compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

  markdown:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --config .lychee.toml './**/*.md'
          fail: true
