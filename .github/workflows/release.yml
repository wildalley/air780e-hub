name: Release

# Publishes the server image to GHCR and attaches provenance to the release.
#
# Distribution is source **and** images (PLAN.md §9). Source builds stay the
# reference path — the image is a convenience, not a replacement, so this
# workflow must never be the only way to get a working deployment.
#
# Triggered by a version tag, never by a branch push: an image that is not
# reachable from an immutable ref cannot be reproduced later, which defeats
# the point of publishing a digest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (must already exist)
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Lowercased at use — GHCR rejects uppercase, and the org name is mixed case.
  IMAGE: ${{ github.repository }}

jobs:
  # The tag must pass the same gates as any commit. A green CI on master does
  # not prove the tagged tree is green: tags are cheap to move and easy to
  # place on the wrong commit.
  verify:
    name: Verify tagged tree
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Server tests
        working-directory: server
        run: |
          uv sync --frozen --extra dev
          uv run --frozen ruff check .
          uv run --frozen pytest -q

      - name: Agent tests
        working-directory: agent
        run: |
          uv sync --frozen --extra dev
          uv run --frozen ruff check .
          uv run --frozen pytest -q

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Same major as server/Dockerfile's frontend stage.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Confirm the tag matches the packaged versions
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          want="${tag#v}"
          fail=0
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error file=$1::version $2 does not match tag $want"
              fail=1
            fi
          }
          check server/pyproject.toml \
            "$(grep -m1 '^version' server/pyproject.toml | cut -d'"' -f2)"
          check agent/pyproject.toml \
            "$(grep -m1 '^version' agent/pyproject.toml | cut -d'"' -f2)"
          check frontend/package.json \
            "$(node -p 'require("./frontend/package.json").version')"
          # A release whose CHANGELOG still says Unreleased ships undocumented.
          if ! grep -q "^## \[${want}\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::no section for [${want}]"
            fail=1
          fi
          exit $fail

  image:
    name: Build and push image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets the runner mint the keyless signing certificate for attestation.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Lowercase the image name
        id: name
        run: echo "value=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      # arm64 is emulated. It roughly triples the frontend stage, which is why
      # this job is not in the PR path — only tags pay for it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}
          # No bare `latest`: a mutable tag makes "which version is deployed"
          # unanswerable after the fact, and rollback needs a digest anyway.
          # release.md tells operators to deploy by digest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=air780e-hub
            org.opencontainers.image.description=Air780E SMS hub server
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Scan the artefact that will actually ship, not a same-Dockerfile local
      # rebuild. The CI job proves the build works; this proves the pushed
      # bytes are clean.
      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.name.outputs.value }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

  release:
    name: Draft the release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom

      - name: Lowercase the image name
        id: name
        run: echo "value=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Extract this version's changelog section
        id: notes
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          want="${tag#v}"
          # From this version's heading to the next one, exclusive.
          awk -v v="$want" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "## 镜像"
            echo
            echo '```'
            echo "${{ env.REGISTRY }}/${{ steps.name.outputs.value }}@${{ needs.image.outputs.digest }}"
            echo '```'
            echo
            echo "按摘要部署，不要用可变 tag。同版本的 \`$want\` 与 \`${want%.*}\` tag 指向同一摘要。"
          } >> notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag || github.ref_name }}" \
            --draft \
            --title "${{ inputs.tag || github.ref_name }}" \
            --notes-file notes.md \
            sbom.spdx.json
