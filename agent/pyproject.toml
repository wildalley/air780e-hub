[project]
name = "air780e-agent"
version = "0.1.0"
description = "Local agent for air780e-hub: owns the serial ports, speaks AT, forwards to server"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
air780e-agent = "air780e_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air780e_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
