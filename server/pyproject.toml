[project]
name = "air780e-hub-server"
version = "0.1.0"
description = "air780e-hub server: WebSocket gateway, message store, push engine and web UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    # Push timestamps render in the configured zone, and the slim Python image
    # carries no system zoneinfo database.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.9.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hub-server = "hub_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
