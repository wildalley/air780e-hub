# air780e-hub server deployment.
#
# The container serves plain HTTP. Terminate TLS at a trusted reverse proxy;
# see docs/deploy.md.

services:
  hub:
    build:
      context: ..
      dockerfile: server/Dockerfile
    # A published image can replace build when one is available.
    container_name: air780e-hub
    restart: unless-stopped

    ports:
      # Secure default: only the host can reach the plain-HTTP port. If a
      # reverse proxy runs in another container, prefer a shared private
      # Docker network; otherwise override HUB_BIND_ADDRESS and firewall it.
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_HOST_PORT:-8090}:8080"

    volumes:
      # SQLite database, agent token and settings.  Back this up.
      - hub-data:/data

    environment:
      HUB_TZ: "${HUB_TZ:-Asia/Shanghai}"
      # Leave HUB_AGENT_TOKEN unset to generate it on first start. Read it
      # with: docker exec air780e-hub hub-server token
      HUB_MESSAGE_RETENTION_DAYS: "${HUB_MESSAGE_RETENTION_DAYS:-90}"
      HUB_STATUS_RETENTION_DAYS: "${HUB_STATUS_RETENTION_DAYS:-30}"
      HUB_BEHIND_PROXY: "${HUB_BEHIND_PROXY:-true}"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hub-data:
