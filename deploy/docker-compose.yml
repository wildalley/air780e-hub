# air780e-hub server deployment.
#
# The container serves plain HTTP. Terminate TLS at a trusted reverse proxy;
# see docs/deploy.md.

services:
  hub:
    # Source build is the reference path and the default here, so a clone
    # deploys with no registry access at all.
    #
    # To run a published image instead, set HUB_IMAGE to a *digest* and drop
    # the build block — `docker compose` ignores build when image is pinned:
    #   HUB_IMAGE=ghcr.io/<owner>/air780e-hub@sha256:<digest>
    # Pin the digest, not the tag: rollback has to name an exact artefact, and
    # `X.Y` moves with every patch release. See docs/release.md.
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: "${HUB_IMAGE:-air780e-hub:local}"
    container_name: air780e-hub
    restart: unless-stopped

    ports:
      # Secure default: only the host can reach the plain-HTTP port. If a
      # reverse proxy runs in another container, prefer a shared private
      # Docker network; otherwise override HUB_BIND_ADDRESS and firewall it.
      - "${HUB_BIND_ADDRESS:-127.0.0.1}:${HUB_HOST_PORT:-8090}:8080"

    volumes:
      # SQLite database, agent token and settings.  Back this up.
      - hub-data:/data

    environment:
      HUB_TZ: "${HUB_TZ:-Asia/Shanghai}"
      # Leave HUB_AGENT_TOKEN unset to generate it on first start. Read it
      # with: docker exec air780e-hub hub-server token
      HUB_MESSAGE_RETENTION_DAYS: "${HUB_MESSAGE_RETENTION_DAYS:-90}"
      HUB_STATUS_RETENTION_DAYS: "${HUB_STATUS_RETENTION_DAYS:-30}"
      # Agent, task and notification logs.  None of these follows message
      # retention, so each needs a horizon of its own; 0 keeps them forever.
      HUB_LOG_RETENTION_DAYS: "${HUB_LOG_RETENTION_DAYS:-30}"
      HUB_AUDIT_RETENTION_DAYS: "${HUB_AUDIT_RETENTION_DAYS:-180}"
      # Applies to resolved incidents only; an open one is kept until it closes.
      HUB_INCIDENT_RETENTION_DAYS: "${HUB_INCIDENT_RETENTION_DAYS:-90}"
      # Ceiling on audit rows, enforced after the age cutoff.
      HUB_AUDIT_MAX_ROWS: "${HUB_AUDIT_MAX_ROWS:-200000}"
      HUB_BEHIND_PROXY: "${HUB_BEHIND_PROXY:-true}"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hub-data:
