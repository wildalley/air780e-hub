<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- This UI shows SMS verification codes; keep it out of search engines
         and out of referer headers. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>air780e-hub</title>
    <!-- Match the token planes so there is no white flash before the app
         mounts in dark mode. -->
    <style>
      html {
        background: #f9f9f7;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0d0d0d;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
